<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>try{var _t=localStorage.getItem("sec_theme");if(_t&&_t!=="black")document.documentElement.classList.add("th-"+_t)}catch(e){}</script>
<style>
:root{--bg:#050507;--tx:#e8edf6;--mu:#7f8ea8;--ln:rgba(255,255,255,.085);--ac:#38bdf8;--ok:#22c55e;--dn:#f43f5e;--mt:#f59e0b;--cy:#22d3ee;--vi:#a78bfa;--pn:#0d0d12;--sk:#0c0c12;--sk2:#0b0b10;--inp:#07070b;--mbg:linear-gradient(160deg,#16161e,#0c0c12)}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(900px 520px at 92% -8%,rgba(56,189,248,.10),transparent 62%),radial-gradient(760px 460px at -6% 18%,rgba(34,197,94,.07),transparent 62%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,'Segoe UI',sans-serif;letter-spacing:-.006em}
.mono,#clk,.ddp{font-family:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{display:flex;min-height:100vh}
/* sidebar */
#sb{width:228px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:12px;background:linear-gradient(180deg,rgba(18,18,26,.94),rgba(8,8,12,.97));border-right:1px solid var(--ln);display:flex;flex-direction:column;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:10px 8px 16px;font-weight:800;font-size:1.05rem}
.logo{width:38px;height:38px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(56,189,248,.35),0 0 20px rgba(56,189,248,.35);flex:none}.logo img{width:100%;height:100%;object-fit:cover;display:block}
#nav{display:flex;flex-direction:column;gap:3px;flex:1}
#nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:none;font-size:.86rem;font-weight:600;text-align:left;color:#cbd5e1;transition:.2s}
#nav button svg{width:18px;height:18px;flex:none;color:#94a3b8}
#nav button:hover{background:rgba(255,255,255,.06);transform:translateX(3px)}
#nav button.on{background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(56,189,248,.05));border-color:rgba(56,189,248,.5);color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
#nav button.on svg{color:var(--ac)}
.sbf{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--ln);margin-top:10px}
#sbbk{display:none}
/* header */
.main{flex:1;min-width:0}
header{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 20px;background:rgba(9,9,13,.7);backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.ttl{font-weight:800;font-size:1.1rem;background:linear-gradient(90deg,#fff,#bae6fd 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.sub{font-size:.68rem;color:var(--mu)}
.ddp{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;border-radius:999px;border:1px solid rgba(56,189,248,.5);background:rgba(56,189,248,.1);color:#bae6fd;font-size:.8rem;font-weight:700;position:relative;cursor:pointer}
.ddp input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.live{font-size:.68rem;padding:.25rem .6rem;border-radius:6px;border:1px solid rgba(34,197,94,.4);color:#4ade80;background:rgba(34,197,94,.07)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#clk{color:#7dd3fc;font-size:.82rem}
main{padding:18px 20px 40px}
h1{margin:0 0 14px;font-size:1.3rem;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
h1::before{content:'';width:5px;height:1.15em;border-radius:9px;background:linear-gradient(var(--ac),var(--ok))}
.tb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;letter-spacing:0;text-transform:none}
/* controls */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);transition:.15s;white-space:nowrap;height:2.25rem;justify-content:center}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.pri{background:linear-gradient(135deg,#16a34a,#0d9488);border-color:rgba(110,231,183,.6);color:#fff}
.dng{background:linear-gradient(135deg,#e11d48,#be185d);border-color:rgba(253,164,175,.6);color:#fff}
.ib{height:2rem;width:2rem;padding:0;border-radius:10px}
.in{width:100%;background:var(--inp);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:.55rem .75rem;font:inherit;font-size:.86rem;color:var(--tx);outline:none;transition:.2s}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(56,189,248,.22)}
select.in{appearance:auto}
textarea.in{resize:vertical;min-height:70px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(2);cursor:pointer}
label.f{display:block;font-size:.76rem;letter-spacing:.02em;color:var(--mu);font-weight:600;margin-bottom:5px}
/* cards */
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--ln);border-radius:18px;padding:1rem 1.2rem;box-shadow:0 18px 40px -26px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05);min-width:0}
.card:hover{border-color:rgba(255,255,255,.14)}
.dbl{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.card.nohv:hover{border-color:var(--ln)}
html:not(.th-blue):not(.th-aurora):not(.th-mono) .card.nohv:hover{border-color:rgba(255,255,255,.075)}
html.th-blue .card.nohv:hover{border-color:#1d3f91}
.fchip{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;color:#bae6fd;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);border-radius:999px;padding:3px 6px 3px 12px;margin-left:auto}
.fchip button{font:inherit;font-size:.7rem;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:2px 10px;cursor:pointer}
.ct{font-size:.9rem;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
.ct small{font-weight:500;color:var(--mu);letter-spacing:0;text-transform:none;font-size:.7rem;margin-left:auto}
.dt{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor;display:inline-block;flex:none}
.g{display:grid;gap:12px;margin-bottom:12px}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c2{grid-template-columns:1fr 1.6fr}.c3{grid-template-columns:1.5fr 1fr 1fr}.c3b{grid-template-columns:1fr 1fr 1.2fr}
.kl{font-size:.76rem;letter-spacing:.02em;color:var(--mu);font-weight:700}
.kv{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:.25rem;font-variant-numeric:tabular-nums}
.ks{font-size:.68rem;color:#8b99b3;margin-top:.15rem}
.kc{position:relative;overflow:hidden}.kc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--ac),var(--ok));opacity:.9}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.seg button{border:0;background:none;padding:.35rem .8rem;border-radius:999px;font-size:.76rem;font-weight:600;color:#aab6cc}
.seg button.on{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 0 14px rgba(34,197,94,.5)}
.pb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;box-shadow:0 0 8px currentColor}
.rw{margin-bottom:.55rem}.rw .t{display:flex;justify-content:space-between;font-size:.76rem;font-weight:700;margin-bottom:3px;gap:8px}
.rw .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.sc{max-height:240px;overflow:auto}
.sc::-webkit-scrollbar,.gw::-webkit-scrollbar,.tw::-webkit-scrollbar{width:6px;height:8px}.sc::-webkit-scrollbar-thumb,.gw::-webkit-scrollbar-thumb,.tw::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
.off{padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:10px;font-size:.78rem}
.off b{font-weight:700}.off .r{text-align:right;font-size:.7rem;color:#9aa8c0}.off .r em{color:#fb7185;font-style:normal;font-weight:700;font-family:inherit;font-size:.78rem;display:block}
.lg{display:flex;align-items:center;gap:.5rem;font-size:.74rem;margin:.22rem 0}
/* tables */
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.76rem;letter-spacing:.02em;color:#7dd3fc;font-weight:600;text-align:left;padding:.6rem .7rem;border-bottom:1px solid rgba(56,189,248,.35);white-space:nowrap}
td{padding:.55rem .7rem;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
tbody tr:hover>td{background:rgba(56,189,248,.06)}
.bdg{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid;cursor:pointer;background:transparent}
.b-ok{color:#4ade80;border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}.b-down{color:#fb7185;border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.1)}.b-mnt{color:#fbbf24;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.1)}.b-nd{color:#94a3b8;border-color:#475569}
.pv{font-family:inherit;font-weight:700}
/* daily grid */
.gw{overflow:auto;max-height:72vh;border-radius:12px;border:1px solid var(--ln)}
table.dg{width:auto;min-width:100%;border-collapse:separate;border-spacing:0}
.dg th,.dg td{padding:0;border-bottom:1px solid rgba(255,255,255,.05);text-align:center}
.dg thead th{position:sticky;top:0;z-index:3;background:var(--sk);padding:.35rem .1rem;border-bottom:1px solid rgba(56,189,248,.35)}
.dg th.n,.dg td.n{position:sticky;left:0;z-index:4;background:var(--sk2);text-align:left;padding:.45rem .8rem;min-width:170px;max-width:220px;border-right:1px solid rgba(255,255,255,.1)}
.dg thead th.n{z-index:6}
.dg td.n b{display:block;font-size:.78rem}.dg td.n small{color:var(--mu);font-size:.66rem}
.dg th.dh{min-width:30px;font-size:.66rem;color:#bae6fd}.dg th.dh small{display:block;color:var(--mu);font-size:.56rem;font-weight:500;text-transform:none;letter-spacing:0}
.dg th.dh.sel,.dg td.sel{background:rgba(56,189,248,.1)}
.dg td.c{cursor:pointer;height:34px;min-width:30px}
.dg td.c i{display:block;margin:5px 4px;height:22px;border-radius:6px}
.dg td.c:hover i{filter:brightness(1.3);transform:scale(1.08)}
.s-ok{background:linear-gradient(#4ade80,#16a34a)}.s-down{background:linear-gradient(#fb7185,#be123c)}.s-mnt{background:linear-gradient(#fbbf24,#d97706)}.s-nd{background:repeating-linear-gradient(45deg,#334155,#334155 4px,#1e293b 4px,#1e293b 8px)}
.dg td.a,.dg th.a{min-width:68px;padding:0 .5rem;font-size:.76rem}
.dg tfoot td{position:sticky;bottom:0;background:var(--sk);font-size:.7rem;font-weight:700;padding:.4rem .2rem;border-top:1px solid rgba(56,189,248,.35);z-index:3}
.dg tfoot td.n{z-index:5}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;color:#9aa8c0;margin-bottom:.6rem}.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
/* modal */
#md{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px}
#md.open{display:flex}
.mb{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--mbg);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:1.2rem 1.3rem;box-shadow:0 30px 80px -20px #000}
.mb h3{margin:0 0 .9rem;font-size:1rem;font-weight:800}
.fr{margin-bottom:.8rem}.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{flex:1;min-width:100px}
.chips input{display:none}
.chips span{display:block;text-align:center;padding:.5rem .4rem;border-radius:12px;border:1px solid rgba(255,255,255,.16);font-size:.76rem;font-weight:700;cursor:pointer}
.chips input:checked+span.c-ok{background:rgba(34,197,94,.2);border-color:#22c55e;color:#4ade80}
.chips input:checked+span.c-down{background:rgba(244,63,94,.2);border-color:#f43f5e;color:#fb7185}
.chips input:checked+span.c-mnt{background:rgba(245,158,11,.2);border-color:#f59e0b;color:#fbbf24}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.dh{margin-left:16px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.dh:active{cursor:grabbing}
tr.dg-src>td{opacity:.35}tr.dr-b>td{box-shadow:inset 0 2px 0 var(--ac)}tr.dr-a>td{box-shadow:inset 0 -2px 0 var(--ac)}
.mf .mfl{margin-right:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;padding:.6rem 1.1rem;border-radius:12px;font-size:.8rem;font-weight:600;background:#14532d;border:1px solid #22c55e;display:none}
#toast.err{background:#7f1d1d;border-color:#f43f5e}
.empty{padding:1.6rem;text-align:center;color:var(--mu);font-size:.85rem}
.pcs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.8rem}
.pc{padding:.5rem .8rem;border-radius:12px;border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.07);font-size:.76rem}.pc b{display:block;font-size:.84rem}
.fg{display:flex;flex-wrap:wrap;gap:12px 14px}.fg>div{max-width:100%}.w1{width:190px}.w2{width:235px}.w3{width:250px}.w4{width:170px}.w5{width:150px}.w6{width:480px}
.ifl .fg{flex-wrap:nowrap;align-items:flex-end;gap:10px}
.ifl .fg>div{min-width:0}
.ifl .w1{width:150px;flex:none}.ifl .wd{width:128px;flex:none}.ifl .wt{width:74px;flex:none}
.ifl .w3{width:auto;flex:1 1 150px}.ifl .w4{width:125px;flex:none}.ifl .w5{width:70px;flex:none}
.ifl .w6{width:auto;flex:2 1 230px}.ifl .wb{flex:none;display:flex;gap:8px;white-space:nowrap}
.ifl .in{padding-left:.55rem;padding-right:.4rem}.ifl .wd .in{padding-right:.2rem}
@media(max-width:1250px){.ifl .fg{flex-wrap:wrap}.ifl .w3{flex:1 1 200px}.ifl .w6{flex:1 1 300px}}.wd{width:170px}.wt{width:110px}
svg text{font-family:'Plus Jakarta Sans',sans-serif}
@media(max-width:1180px){.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.c2,.c3,.c3b{grid-template-columns:1fr}}
@media(max-width:1023px){
 #sb{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.25s;box-shadow:12px 0 40px rgba(0,0,0,.6)}
 body.so #sb{transform:none}
 body.so #sbbk{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6)}
 header{padding:10px 12px}main{padding:14px 12px 40px}
 .k5,.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.k6{grid-template-columns:repeat(2,minmax(0,1fr))}

 .kv{font-size:1.5rem}
}
@media(max-width:560px){.r2{grid-template-columns:1fr}.hr #clk{display:none}}
body.sbh #sb{display:none}
#mp{display:none}
.mpg{page-break-after:always;color:#0f172a;font-family:'Plus Jakarta Sans',Arial,sans-serif}.mpg:last-child{page-break-after:auto}
.mpg .b1{background:#0c1c40;color:#fff;font-weight:800;font-size:15pt;padding:6px 10px}.mpg .b2{background:#1d3f91;color:#fff;font-weight:700;font-size:10pt;padding:4px 10px}.mpg .b3{background:#e8eef9;color:#334155;font-size:7pt;padding:3px 10px}
.mpg .kp{display:flex;gap:6px;margin:8px 0}.mpg .kp div{flex:1;border:1px solid #b8c4da;background:#f8fafc;text-align:center;padding:3px}.mpg .kp small{display:block;font-size:6.5pt;color:#475569}.mpg .kp b{font-size:13pt}
.mpg table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-top:6px}
.mpg th{background:#1d3f91;color:#fff;border:1px solid #b8c4da;padding:3px 4px;font-size:7pt;letter-spacing:0;text-transform:none;text-align:center}
.mpg td{border:1px solid #b8c4da;padding:2px 4px;color:#0f172a;background:none;font-size:7.5pt}
.mpg tbody tr:nth-child(even) td{background:#f1f5f9}
.mpg td.cc{text-align:center;padding:2px 1px;font-weight:700;font-size:6.5pt}
.mxl{display:flex;align-items:center;gap:10px;padding:.55rem .8rem;border:1px solid var(--ln);border-radius:12px;font-size:.84rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.03)}
.mxl input{width:17px;height:17px;accent-color:#22c55e;flex:none}.mxl b{color:var(--mu);font-family:inherit;font-size:.74rem;min-width:1.4rem}
.mxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
@media print{html.mp-on,html.mp-on body{background:#fff!important}html.mp-on .wrap,html.mp-on #md,html.mp-on #toast{display:none!important}html.mp-on #mp{display:block}}


/* ---- scrollbars (theme matched) ---- */
*{scrollbar-width:thin;scrollbar-color:rgba(125,140,168,.32) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(125,140,168,.30);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
html.dash{scrollbar-width:none}html.dash::-webkit-scrollbar{display:none}
/* sticky header solid (green boxes show-through fix) */

.dg th.dh.sel{background-image:linear-gradient(rgba(56,189,248,.12),rgba(56,189,248,.12));background-color:var(--sk)}
.dg thead th,.dg thead th.n{background-color:var(--sk)}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(2);cursor:pointer}
.tin{margin-top:6px}
/* sidebar separators */
#nav .sp{display:block;flex:none;align-self:stretch;height:1px;margin:7px 10px;background:linear-gradient(90deg,transparent,rgba(148,163,184,.45),transparent)}
/* dashboard: one-screen fit (desktop) */
.dfit .sgrid{display:block}
@media(min-width:1024px) and (min-height:600px){
 html.dash,html.dash body{height:100%;overflow:hidden}
 html.dash .wrap{height:100vh;min-height:0}
 html.dash .main{display:flex;flex-direction:column;height:100vh;min-height:0}
 html.dash main{flex:1;min-height:0;padding:10px 18px 12px;overflow:hidden}
 .dfit{height:100%;display:flex;flex-direction:column;gap:9px;min-height:0}
 .dfit>h1{margin:0;flex:none;font-size:1.15rem}
 .dfit .g{margin:0;min-height:0}

 .dfit .g.k6{flex:none}
 .dfit .fr2{flex-grow:.95!important}.dfit .fr3{flex-grow:1.3!important}.dfit .fr4{flex-grow:1.1!important}
 .dfit .card{display:flex;flex-direction:column;overflow:hidden;padding:.55rem .85rem;min-height:0;border-radius:15px}

 .dfit .cb{flex:1;min-height:0;overflow:hidden}

/* ---- dashboard entrance animations ---- */
@keyframes dxin{from{opacity:0;transform:translateY(12px)}}
@keyframes dxgrow{from{transform:scaleX(0)}}
@keyframes dxring{from{stroke-dasharray:0 1000}}
@keyframes dxdraw{from{stroke-dashoffset:1}}
@keyframes dxfade{from{opacity:0}}
@keyframes dxpg{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.tr,.rg svg,.dn svg{shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
.tr text{font-family:inherit}
.dxping{transform-box:fill-box;transform-origin:center;animation:dxpg 2s ease-out infinite}
.dx-a .da{animation:dxin .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0)*70ms)}
.dx-a .bar i{transform-origin:left;animation:dxgrow 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms + 250ms)}
.dx-a .dxrg,.dx-a .dxdn{animation:dxring 1.4s cubic-bezier(.2,.8,.2,1) backwards}
.dx-a .dxline{stroke-dasharray:1;animation:dxdraw 1.8s cubic-bezier(.4,0,.2,1) backwards .3s}
.dx-a .dxarea{animation:dxfade 1.4s ease backwards 1s}
@media (prefers-reduced-motion:reduce){.dx-a *,.dxping{animation:none!important}}
/* live badge pulse + header links + disabled next */
@keyframes lvp{70%{box-shadow:0 0 0 7px rgba(var(--c),0)}100%{box-shadow:0 0 0 0 rgba(var(--c),0)}}
.live .lvd{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;--c:52,211,153;box-shadow:0 0 0 0 rgba(var(--c),.6)}
.live[data-s=ok] .lvd{animation:lvp 1.8s infinite}
.live[data-s=load] .lvd{--c:56,189,248;animation:lvp 1s infinite}
.live[data-s=err] .lvd{--c:245,158,11}
.hl{color:var(--mu);text-decoration:none;cursor:pointer;transition:.15s}.hl:hover{color:var(--ac)}.hl.on{color:#bae6fd;font-weight:700}
.hsep{margin:0 .35rem;opacity:.45}
.btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none;transform:none}

<script>

const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};

const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nowLocal=()=>{const d=new Date();return iso(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};

const IC={

 ev:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

 boom:'<path d="M3 14h18M3 10h18M6 10v9M18 10v9M7 10v4M11 10v4M15 10v4"/>',

 hhmd:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',

 mx:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v5M9.5 14.5 12 17l2.5-2.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 del:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
 dl:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',pr:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>',
 sr:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 grip:'<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>'
};
const ico=(k,w)=>'<svg viewBox="0 0 24 24" width="'+(w||18)+'" height="'+(w||18)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';
const SECS=[
 {k:'dash',n:'Dashboard'},{k:'intox',n:'Intoxication Incident'},{k:'ev',n:'Events'},
 {k:'boom',n:'Boom Barrier',e:1},{k:'flap',n:'Flap Barrier',e:1},{k:'walkie',n:'Walkie Talkie',e:1},{k:'speed',n:'Speed Gun',e:1},
 {k:'bca',n:'BCA Machine',e:1},{k:'hhmd',n:'HHMD',e:1},{k:'vwall',n:'Video Wall',e:1},{k:'work',n:'Workstation',e:1},
 {k:'vehicle',n:'Vehicle',e:1},{k:'torch',n:'Torch',e:1},{k:'app',n:'Application',e:1},{k:'mx',n:'Master Export'},{k:'set',n:'Settings'}];
const ES=SECS.filter(s=>s.e),secOf=k=>SECS.find(s=>s.k===k);

const PAL=['#22d3ee','#a78bfa','#f59e0b','#22c55e','#f43f5e','#38bdf8','#e879f9','#fb923c','#84cc16','#2dd4bf','#f472b6'];

/* ---------- data ---------- */
const KEY='sec_equipment_tracker_v1';
let S=null;
function seed(){
 const q=(sec,arr)=>arr.map((a,i)=>({id:sec+(i+1),name:a[0],code:a[1]||'',loc:a[2]||'',rem:'',since:START}));
 const g=(p)=>GATES.map((x,i)=>[p+' '+(i+1),'',x]);
 const e={
  boom:q('boom',g('Boom Barrier')),
  flap:q('flap',[['Flap Barrier 1','','Main Plant Gate'],['Flap Barrier 2','','Township Gate']]),
  walkie:q('walkie',[1,2,3].map(i=>['Walkie Talkie '+i,'','Control Room'])),
  speed:q('speed',[1,2].map(i=>['Speed Gun '+i,'','Security Office'])),
  bca:q('bca',g('BCA Machine')),hhmd:q('hhmd',g('HHMD')),
  vwall:q('vwall',[['Video Wall 1','','Control Room']]),
  work:q('work',[1,2].map(i=>['Workstation '+i,'','Control Room'])),
  vehicle:q('vehicle',[1,2].map(i=>['Vehicle '+i,'','Security Dept'])),
  torch:q('torch',[1,2,3].map(i=>['Torch '+i,'','Security Office'])),
  app:q('app',[1,2].map(i=>['Application '+i,'','']))};
 return{eq:e,st:{},intox:[],seq:100};
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.eq){S=seed();}
ES.forEach(s=>{if(!S.eq[s.k])S.eq[s.k]=[]});S.st=S.st||{};S.intox=S.intox||[];function fixPlant(v){return(!v||v==='Security Department – Control Room')?'Vedanta Limited Chhattisgarh Thermal Power Plant – Security Department':v}
S.plant=fixPlant(S.plant);S.uname=S.uname||'Admin';
let saveErr=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveErr){saveErr=1;toast('Browser storage is blocked, so the local cache cannot be saved.',1)}}cloudPush()}
const uid=()=>'i'+(++S.seq)+Date.now().toString(36);

/* ---------- status helpers ---------- */
const sK=(sec,id,d)=>sec+'|'+id+'|'+d;
function stAt(sec,e,d){if(d<e.since)return'nd';const r=S.st[sK(sec,e.id,d)];return r?r.s:'ok'}
function eqStats(sec,e,a,b){let ok=0,dn=0,mn=0;rng(a,b).forEach(d=>{const s=stAt(sec,e,d);if(s==='ok')ok++;else if(s==='down')dn++;else if(s==='mnt')mn++});const t=ok+dn+mn;return{ok,dn,mn,t,av:t?ok/t*100:null}}
function secStats(sec,a,b){let ok=0,t=0,dn=0;S.eq[sec].forEach(e=>{const x=eqStats(sec,e,a,b);ok+=x.ok;t+=x.t;dn+=x.dn+x.mn});return{ok,t,dn,av:t?ok/t*100:null}}
const fp=v=>v==null?'–':(Math.round(v*100)/100)+'%';
const colAv=v=>v==null?'#94a3b8':v>=TARGET?'#4ade80':v>=80?'#fbbf24':'#fb3b5c';
function setSt(sec,id,days,s,r,m,ft,tt){days.forEach((d,i)=>{const k=sK(sec,id,d);if(s==='ok')delete S.st[k];else{const o={s:s,r:r||'',m:m||''};if(i===0&&ft)o.ft=ft;if(i===days.length-1&&tt)o.tt=tt;S.st[k]=o}})}

/* ---------- view state ---------- */
const V={sec:(location.hash||'#dash').slice(1),date:TODAY(),per:'all',q:'',edit:null,eqOpen:false,dxA:1};
if(!secOf(V.sec))V.sec='dash';
function perR(){const e=V.date;if(V.per==='all')return[START,e];const n={'1d':1,'1w':7,'1m':30}[V.per];const s=addD(e,-(n-1));return[s<START?START:s,e]}
const PN={all:'All time','1m':'1 Month','1w':'1 Week','1d':'1 Day'};

/* ---------- shell ---------- */
function nav(){$('#nav').innerHTML=SECS.map(s=>'<button class="'+(s.k===V.sec?'on':'')+'" onclick="go(\''+s.k+'\')">'+ico(s.k==='dash'?'dash':s.k)+s.n+'</button>'+(s.k==='ev'||s.k==='app'?'<i class="sp"></i>':'')).join('')}
function go(k){if(k==='dash'&&V.sec!=='dash')V.dxA=1;V.eqF=null;V.ig=null;V.sec=k;V.q='';V.edit=null;history.replaceState(null,'','#'+k);if(innerWidth<1024)sbT(0);R();window.scrollTo(0,0)}
function sbT(f){const w=innerWidth<1024;if(w){document.body.classList.toggle('so',f===undefined?!document.body.classList.contains('so'):!!f)}else{document.body.classList.toggle('sbh',f===undefined?!document.body.classList.contains('sbh'):!f)}}
function dnav(n){const t=TODAY();let d=addD(V.date,n);if(d<START)d=START;if(d>t)d=t;V.date=d;R()}
function dset(v){if(!v)return;const t=TODAY();if(v<START)v=START;if(v>t)v=t;V.date=v;R()}
function fsT(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function openM(h){$('#mbx').innerHTML=h;$('#md').classList.add('open')}
function closeM(){$('#md').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function eqOne(sec,id){go(sec);V.eqF=id;R();window.scrollTo(0,0)}
function evReason(i){const r=V.rl&&V.rl[i];if(r==null)return;const a=V.rA,b=V.rB;go('ev');V.evf={sec:'',st:'',a:a||START,b:(!b||b===TODAY())?'':b,rs:r};R();window.scrollTo(0,0)}
function intoxGate(i){const g=GATES[i];if(!g)return;go('intox');V.ig=g;R();window.scrollTo(0,0)}
function R(){
 const t=TODAY();if(V.date>t)V.date=t;
 nav();$('#un').textContent=S.uname;$('#nx').disabled=V.date>=t;$('#hl').innerHTML=[['ev','Events'],['dash','Dashboard'],['mx','Master Export']].map(x=>'<a class="hl'+(V.sec===x[0]?' on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</a>').join('<span class="hsep">|</span>');$('#dd').textContent=dmy(V.date);const dp=$('#dpk');dp.min=START;dp.max=t;dp.value=V.date;
 const m=$('#main');document.documentElement.classList.toggle('dash',V.sec==='dash');
 if(V.sec==='dash')m.innerHTML=vDash();else if(V.sec==='ev')m.innerHTML=vEvents();else if(V.sec==='intox'){m.innerHTML=vIntox();intoxList();if(V.edit)intoxFill(V.edit);else intoxReset()}else if(V.sec==='set')m.innerHTML=vSet();else if(V.sec==='mx')m.innerHTML=vMaster();else m.innerHTML=vEq(V.sec);

 if(V.sec==='dash')dashFit(1);
}
setInterval(()=>{const d=new Date();$('#clk').textContent=p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())},1000);

/* ---------- charts ---------- */
function ring(items){ // items:[{p,c}] – 220 unit viewBox for crisp rendering
 let h='<svg viewBox="0 0 220 220" width="150" height="150">';
 items.forEach((x,i)=>{const r=94-i*24,C=2*Math.PI*r,p=Math.max(0,Math.min(100,x.p||0));
  h+='<circle cx="110" cy="110" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-opacity=".16" stroke-width="17"/><circle cx="110" cy="110" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-width="17" stroke-linecap="round" stroke-dasharray="'+(C*p/100).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 110 110)" class="dxrg" style="filter:drop-shadow(0 0 4px '+x.c+'88);animation-delay:'+(i*150)+'ms"/>'});
 return h+'</svg>'}
function donut(parts,center,sub){
 const tot=parts.reduce((a,b)=>a+b.v,0)||1,r=44,C=2*Math.PI*r;let off=0,h='<svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="13"/>';
 parts.forEach((p,pi)=>{const l=C*p.v/tot;if(p.v>0)h+='<circle class="dxdn" style="animation-delay:'+(pi*120)+'ms" cx="60" cy="60" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="13" stroke-dasharray="'+Math.max(0,l-1.5)+' '+(C-Math.max(0,l-1.5))+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=l});
 return h+'<text x="60" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">'+center+'</text><text x="60" y="76" text-anchor="middle" font-size="7" letter-spacing="1.5" fill="#7f8ea8">'+sub+'</text></svg>'}
function trend(days,fn,W,H){ // W,H = real pixel size of the container (1 unit = 1 px, so text stays sharp)
 W=W||640;H=H||210;const L=48,Rr=18,T=16,B=30,vals=days.map(fn);const real=vals.filter(v=>v!=null);
 const mn=real.length?Math.min(...real):100;let lo=Math.min(90,Math.floor(mn/5)*5);if(lo>=100)lo=90;const hi=100;
 const x=i=>L+(days.length<2?(W-L-Rr)/2:i*(W-L-Rr)/(days.length-1)),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let h='<svg viewBox="0 0 '+W+' '+H+'" class="tr" width="'+W+'" height="'+H+'" style="width:100%;height:100%;display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".32"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>';
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;h+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-8)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#8b99b3">'+(Math.round(v*10)/10)+'%</text>'}
 if(TARGET>=lo)h+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(TARGET).toFixed(1)+'" y2="'+y(TARGET).toFixed(1)+'" stroke="#e8c872" stroke-dasharray="3 4" opacity=".8"/><text x="'+(W-Rr)+'" y="'+(y(TARGET)-5).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="#e8c872">TARGET '+TARGET+'%</text>';
 const pts=days.map((d,i)=>vals[i]==null?null:[x(i),y(vals[i])]).filter(Boolean);
 if(pts.length){const ln=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dd='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  h+='<polygon class="dxarea" points="'+pts[0][0].toFixed(1)+','+(H-B)+' '+ln+' '+pts[pts.length-1][0].toFixed(1)+','+(H-B)+'" fill="url(#ga)"/><path class="dxline" d="'+dd+'" pathLength="1" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(74,222,128,.55))"/>';
  days.forEach((d,i)=>{if(vals[i]!=null)h+='<circle class="dxarea" cx="'+x(i).toFixed(1)+'" cy="'+y(vals[i]).toFixed(1)+'" r="3.4" fill="#0a0a0d" stroke="#4ade80" stroke-width="2"><title>'+dmy(d)+' – '+fp(vals[i])+'</title></circle>'});
  const lp=pts[pts.length-1];h+='<circle class="dxping" cx="'+lp[0].toFixed(1)+'" cy="'+lp[1].toFixed(1)+'" r="4" fill="none" stroke="#4ade80"/>'}
 const step=Math.ceil(days.length/Math.max(3,Math.floor((W-L-Rr)/60)));days.forEach((d,i)=>{if(i%step===0||i===days.length-1)h+='<text x="'+x(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="#8b99b3">'+d.slice(8)+'-'+d.slice(5,7)+'</text>'});
 return h+'</svg>'}
function dashFit(first){
 if(V.sec!=='dash'||!V.tr)return;const c=document.getElementById('trc');if(!c)return;
 const w=Math.round(c.clientWidth);if(w<160)return;
 const fit=window.matchMedia&&matchMedia('(min-width:1024px) and (min-height:600px)').matches;
 const H=fit?Math.round(c.clientHeight):Math.max(170,Math.min(260,Math.round(w*0.45)));if(H<90)return;
 if(!first){const f=document.querySelector('.dfit');if(f)f.classList.remove('dx-a')}
 c.innerHTML=trend(V.tr.d,V.tr.f,w,H)}
let _rz=0;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>dashFit(0),150)});

/* ---------- dashboard ---------- */
function allEq(){const a=[];ES.forEach(s=>S.eq[s.k].forEach(e=>a.push({sec:s.k,e:e})));return a}
function streak(sec,e,d){let n=0;while(d>=e.since&&stAt(sec,e,d)!=='ok'){n++;d=addD(d,-1)}return n}
function intoxIn(a,b){return S.intox.filter(r=>{const d=r.dt.slice(0,10);return d>=a&&d<=b})}
function vDash(){

/* time boxes (HH:MM mask + live clock) */
const nowHM=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
function tmMask(el,ev){
 el.dataset.auto='0';
 let v=el.value.replace(/\D/g,'').slice(0,4);
 if(v.length===1&&+v>2)v='0'+v;
 if(v.length===2&&+v>23)v='23';
 if(v.length===3&&+v[2]>5)v=v.slice(0,2)+'0'+v[2];
 if(v.length===4&&+v.slice(2)>59)v=v.slice(0,2)+'59';
 const del=ev&&ev.inputType&&ev.inputType.indexOf('delete')===0;
 el.value=v.length>2?v.slice(0,2)+':'+v.slice(2):(v.length===2&&!del?v+':':v)}
setInterval(()=>{['sft','stt'].forEach(id=>{const el=document.getElementById(id);if(el&&el.dataset.auto==='1'&&document.activeElement!==el)el.value=nowHM()})},1000);
const tmOK=v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v);

function stSave(sec,id){

 const e=S.eq[sec].find(x=>x.id===id);if(a<e.since)a=e.since;
 setSt(sec,id,rng(a,b),s,s==='ok'?'':$('#sr').value,s==='ok'?'':$('#sm').value.trim(),ft,tt);

  const a=g.split('|'),sec=a[0],id=a[1],e=(S.eq[sec]||[]).find(x=>x.id===id);if(!e)return;
  const L=grp[g].filter(x=>x.d>=e.since&&x.d<=t).sort((p,q)=>p.d.localeCompare(q.d));
  let run=null;const flush=()=>{if(!run)return;const f=run[0],l=run[run.length-1];
   const ft=f.r.ft||'',tt=l.r.tt||'',ongoing=!tt&&l.d>=t;
   const st=DT(f.d,ft),en=tt?DT(l.d,tt):ongoing?new Date():DT(addD(l.d,1),'00:00');
   let rm='';run.forEach(x=>{if(x.r.m)rm=x.r.m});
